services:
  bytesqueeze-worker:
    image: kevina1724/bytesqueeze-tsd-worker:latest
    pull_policy: always
    container_name: bytesqueeze-worker
    restart: unless-stopped
    ports:
      - "${TSD_WORKER_PORT:-8082}:8080"
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      TSD_WORKER_NAME: ${TSD_WORKER_NAME:-ByteSqueeze Worker}
      # Large sources may pause while the controller/NAS catches up. The
      # worker retries interrupted downloads before marking a job failed.
      TSD_WORKER_TRANSFER_TIMEOUT_SECONDS: ${TSD_WORKER_TRANSFER_TIMEOUT_SECONDS:-300}
      TSD_WORKER_TRANSFER_ATTEMPTS: ${TSD_WORKER_TRANSFER_ATTEMPTS:-3}
      # auto: use QSV decode with Intel QSV encoders; qsv: prefer QSV decode
      # for supported H.264/HEVC sources; off: force software decoding.
      TSD_HW_DECODE: ${TSD_HW_DECODE:-auto}
      # Adapter 0 is resolved by the patched HandBrake build to this Linux
      # DRM render node instead of being passed to VAAPI as device "0".
      TSD_QSV_ADAPTER: ${TSD_QSV_ADAPTER:-0}
      TSD_QSV_RENDER_DEVICE: ${TSD_QSV_RENDER_DEVICE:-/dev/dri/renderD128}
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-iHD}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # Map a fast, durable host drive to /work. This preserves pairing state
      # in /work/state and holds temporary sources/outputs in /work/jobs.
      # See docs/HEADLESS_WORKER.md for Linux, Unraid, and Windows examples.
      - type: bind
        source: ${TSD_WORKER_WORK_DIR:-./worker-work}
        target: /work

    # Optional Intel Quick Sync support on Linux. Uncomment when /dev/dri is
    # available on the worker host.
    # devices:
    #   - /dev/dri:/dev/dri

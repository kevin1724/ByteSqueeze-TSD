name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      channel:
        description: Optional extra image channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - sha-only
      controller_version_tag:
        description: Optional additional controller image tag
        required: false
        default: ""
        type: string
      worker_version_tag:
        description: Optional additional worker image tag
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTROLLER_IMAGES: |
    kevina1724/bytesqueeze-tsd
    kevina1724/handbrake-tsd-helper
  WORKER_IMAGES: |
    kevina1724/bytesqueeze-tsd-worker
    kevina1724/handbrake-tsd-worker
  CONTROLLER_VERSION: 3.25.1
  WORKER_VERSION: 2.13.7

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: kevina1724
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[worker-only]') }}
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CONTROLLER_IMAGES }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=${{ env.CONTROLLER_VERSION }},enable={{is_default_branch}}
            type=raw,value=3.25,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'beta' }}
            type=raw,value=${{ inputs.controller_version_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.controller_version_tag != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ByteSqueeze-TSD
            org.opencontainers.image.description=Web dashboard and queue manager for HandBrake transcoding

      - name: Build and push image
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[worker-only]') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: controller
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate worker image metadata
        id: worker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WORKER_IMAGES }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=${{ env.WORKER_VERSION }},enable={{is_default_branch}}
            type=raw,value=2.13,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'beta' }}
            type=raw,value=${{ inputs.worker_version_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.worker_version_tag != '' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ByteSqueeze Headless Worker
            org.opencontainers.image.description=Transfer-only HandBrake worker for a ByteSqueeze controller

      - name: Build and push headless worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
          annotations: ${{ steps.worker-meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=worker
          provenance: mode=max
          sbom: true
